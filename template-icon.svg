<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Envelope body -->
  <g transform="translate(128,128)">
    <rect x="-72" y="-48" width="144" height="104" rx="14" fill="url(#env)"/>
    <!-- Envelope flap -->
    <path d="M-72 -48 L0 10 L72 -48" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Padlock shackle -->
    <path d="M-14 -28 A14 14 0 0 1 14 -28 V -18" stroke="#F59E0B" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Padlock body -->
    <rect x="-24" y="-18" width="48" height="52" rx="10" fill="#F59E0B"/>
    <!-- Keyhole -->
    <circle cx="0" cy="2" r="6" fill="#0F172A"/>
    <path d="M-3 4 L3 4 L5 16 L-5 16 Z" fill="#0F172A"/>
  </g>
</svg>